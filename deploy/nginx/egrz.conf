# Дашборд ЕГРЗ: web/ статикой + data/export как /data/.
#
# Отдельная секция /data/ (а не копирование файлов в web/data) означает, что
# после каждого `egrz daily` дашборд подхватывает свежую витрину без
# дополнительных шагов — nginx просто читает каталог заново на каждый запрос.
#
# Установка: см. deploy/install.sh — он подставит сюда реальный путь и порт.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/egrz/web;
    index index.html;

    location /data/ {
        alias /opt/egrz/data/export/;
        add_header Cache-Control "no-cache";
        # Витрина может быть в процессе перезаписи в момент запроса —
        # 404 на data/*.json надёжнее молчаливо отдать один раз, чем полу-файл.
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # CSV/JSON отдаются как есть — браузер сам решает, скачать или показать.
    gzip on;
    gzip_types application/json text/csv text/css application/javascript;
}
