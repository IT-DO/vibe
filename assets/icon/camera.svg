<!--
  Иконка приложения: ретро-фотоаппарат.

  Рисунок подчинён двум ограничениям. Первое — размер: на экране телефона
  иконка занимает около 48 точек, поэтому форм мало, они крупные, и мелких
  деталей нет совсем. Второе — палитра приложения: тот же тёмный фон и тот
  же коралловый, что на заставке, чтобы иконка и будка выглядели одним.

  Холст 108×108 — так устроены адаптивные иконки Android. Содержимое
  держится внутри центрального круга диаметром 66: всё, что снаружи,
  система вправе срезать под форму значка своей прошивки.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <g>
    <!-- Выступ видоискателя. -->
    <rect x="44" y="33" width="20" height="9" rx="3" fill="#FFFFFF"/>

    <!-- Корпус. -->
    <rect x="24" y="40" width="60" height="38" rx="7" fill="#FFFFFF"/>

    <!-- Объектив: кольцо в цвет заставки. -->
    <circle cx="54" cy="59" r="15" fill="#FF5A5F"/>
    <circle cx="54" cy="59" r="9" fill="#0B0B10"/>
    <!-- Блик — он оживляет плоскую форму и читается даже мелко. -->
    <circle cx="49" cy="54" r="3" fill="#FFFFFF" opacity="0.85"/>

    <!-- Вспышка. -->
    <circle cx="74" cy="49" r="3.5" fill="#FF5A5F"/>
  </g>
</svg>
