[project]
name = "egrz-daily"
version = "0.1.0"
description = "Ежедневная выгрузка реестра заключений экспертизы (ЕГРЗ), нормализация, умные фильтры и инфографика"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
egrz = "egrz.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["egrz*"]

[tool.setuptools.package-data]
egrz = ["sources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
