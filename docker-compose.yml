services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # Наружу торчит только 127.0.0.1: снаружи в контейнер ходит
      # обратный прокси (Caddy/nginx), который держит HTTPS.
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      # ОБЯЗАТЕЛЬНО. Перекрывает DATABASE_PATH из .env.
      #
      # В .env путь относительный (./data/app.db) - и это правильно для
      # запуска на ноутбуке. Но внутри контейнера тот же путь означал бы
      # папку ВНУТРИ образа, а не примонтированную с диска сервера.
      # Последствия: сервис падает при старте (нет прав на запись), а если
      # бы права были - база жила бы внутри контейнера и стиралась при
      # каждой пересборке, унося всех пользователей и все платежи.
      #
      # env_file читается раньше environment, поэтому побеждает эта строка.
      DATABASE_PATH: /data/app.db
    volumes:
      # База живёт на диске сервера, а не внутри контейнера.
      # Пересобрал образ - данные на месте.
      - ./data:/data
