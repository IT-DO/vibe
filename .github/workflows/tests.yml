name: Тесты

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      # Проверяем, что конвейер целиком проходит на офлайн-данных.
      - run: |
          python -m egrz.cli daily --source demo --demo-count 500 --full
          test -s data/export/dataset.json
